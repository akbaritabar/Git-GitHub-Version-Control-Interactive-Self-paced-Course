  <rect width="1200" height="700" fill="#f5f1e8"/>
  <rect x="45" y="45" width="1110" height="610" rx="28" fill="#fffaf2" stroke="#1f3a5f" stroke-width="6" stroke-dasharray="18 14"/>
  <circle cx="170" cy="150" r="54" fill="#c85c38"/>
  <rect x="255" y="112" width="520" height="28" rx="14" fill="#1f3a5f"/>
  <rect x="255" y="162" width="410" height="20" rx="10" fill="#5f7a99"/>
  <rect x="95" y="255" width="1010" height="90" rx="18" fill="#efe3cf"/>
  <rect x="95" y="380" width="1010" height="90" rx="18" fill="#efe3cf"/>
  <rect x="95" y="505" width="1010" height="90" rx="18" fill="#efe3cf"/>
